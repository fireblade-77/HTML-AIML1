<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic and Non-Semantic Example</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    header { background: #0077b6; color: white; padding: 15px; }
    section { margin-top: 20px; padding: 15px; background: #caf0f8; }
    .box { background: #ffd60a; padding: 10px; margin-top: 10px; }
    .highlight { color: red; font-weight: bold; }
  </style>
</head>
<body>
  
  <!-- Semantic element -->
  <header>
    <h1>Welcome to My Website</h1>
    <p>This is a <b>semantic header</b> section.</p>
  </header>
  
  <!-- Semantic element -->
  <section>
    <h2>About Us</h2>
    <p>This is a section that explains something.</p>
  </section>
  
  <!-- Non-semantic element -->
  <div class="box">
    <p>This content is inside a <span class="highlight">non-semantic</span> div.</p>
  </div>
  
  <!-- Non-semantic element -->
  <span>This is another non-semantic inline element (span).</span>

</body>
</html>
