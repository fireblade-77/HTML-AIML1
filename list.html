<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>Unordered List</h1>
    <h2>Fruits</h2>

    <ul type="square">
        <li>Mango</li>
        <li>Banana</li>
        <li>Litchie</li>
    </ul>
    <h1>Ordered List</h1>
    <h3>Vegetables</h3>
    <ol type="A">
        <li>Tomato</li>
        <li>Carrot</li>
        <li>Brinjal</li>
        <li>Potato</li>
    </ol>
    <h1>Description List</h1>
    <dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Language</dd>
        <dt>JS</dt>
        <dd>Java Script</dd>
    </dl>
    

</body>
</html>
