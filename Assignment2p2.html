<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperlink Examples</title>
</head>
<body>

  <h1>Hyperlink Examples</h1>
  
  <!-- Text hyperlink -->
  <p>Visit <a href="https://www.wikipedia.org" target="_blank">Wikipedia</a> for knowledge.</p>
  
  <!-- Image hyperlink -->
  <p>
    <a href="https://www.google.com" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/Google_Chrome_icon_(September_2014).svg" 
           alt="Google Logo" width="100">
    </a>
  </p>
  
  <!-- Video hyperlink -->
  <p>
    <a href="https://www.youtube.com/" target="_blank">
      <video width="200" controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </a>
  </p>
  
  <!-- Audio hyperlink -->
  <p>
    <a href="https://soundcloud.com/" target="_blank">
      <audio controls>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </a>
  </p>

</body>
</html>
